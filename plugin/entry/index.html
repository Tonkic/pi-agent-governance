<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pi-plugin-chrome" content="v2">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent Governance</title>
  <link rel="stylesheet" href="entry.css">
  <script src="entry.js" defer></script>
</head>
<body>
  <main aria-labelledby="title">
    <p id="eyebrow">AGENT GOVERNANCE</p>
    <h1 id="title">Browser workbench</h1>
    <p id="description">One workbench in your browser. Your conversation and model stay in the host.</p>
    <section aria-labelledby="project-label">
      <h2 id="project-label">Current project</h2>
      <p id="project">—</p>
      <p id="status" role="status" aria-live="polite">Checking connection…</p>
    </section>
    <div class="actions">
      <button id="open" type="button" disabled>Open browser workbench</button>
      <button id="refresh" type="button">Refresh status</button>
    </div>
    <p id="hint">Loading this entry never opens the browser. Click Open when you are ready.</p>
  </main>
</body>
</html>
