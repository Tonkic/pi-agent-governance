<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pi-plugin-chrome" content="v2">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title data-i18n="app"></title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="views.css">
</head>
<body>
<main class="app-shell">
  <nav class="workspace-nav" data-i18n-aria-label="navigation">
    <span class="nav-brand">G <span data-i18n="brand"></span></span>
    <span class="nav-label" data-i18n="workspace"></span>
    <a href="#architecture"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="3" width="8" height="5" rx="1.5"/><path d="M12 8v5M5 16v-3h14v3"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/></svg><span data-i18n="navArchitecture"></span></a>
    <a href="#board-section"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16M5 8h2M11 8h2M17 8h2"/></svg><span data-i18n="navBoard"></span></a>
    <a href="#git-section"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10M18 8v3a5 5 0 0 1-5 5H6"/></svg><span data-i18n="navGit"></span></a>
    <span class="nav-note" data-i18n="local"></span>
  </nav>
  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4.5 7.2v9.6L12 21l7.5-4.2V7.2L12 3Z"/><path d="m4.8 7.4 7.2 4.1 7.2-4.1M12 11.5V21"/><circle cx="12" cy="7" r="1.4" fill="currentColor" stroke="none"/></svg>
      </span>
      <div>
        <p class="eyebrow" data-i18n="overview"></p>
        <h1 id="page-title" data-i18n="navArchitecture"></h1>
      </div>
    </div>
    <span id="status" class="badge">—</span>
  </header>
  <section id="action-panel" class="action-panel-bar" data-i18n-aria-label="actionPanel">
    <div class="action-group" role="group" data-i18n-aria-label="pageActions"><span class="action-group-label" data-i18n="pageActions"></span><div class="action-group-controls"><button id="refresh" type="button" data-i18n="refresh" data-i18n-aria-label="refreshState"></button><button id="board-new" class="primary" type="button" data-page-control="board-section" data-i18n="newItem"></button><button id="architecture-analyze" class="primary" type="button" data-page-control="architecture" data-i18n="reanalyzeArchitecture" hidden></button></div></div>
    <div class="action-group" role="group" data-i18n-aria-label="projectTasks"><span class="action-group-label" data-i18n="projectTasks"></span><div class="action-group-controls"><button id="project-open" type="button" data-i18n="projectControls"></button><button id="analysis-start" type="button" data-i18n="startAnalysis"></button><button id="operations-open" type="button" data-i18n="analysisProgress"></button></div></div>
    <div class="action-group" role="group" data-i18n-aria-label="displaySettings"><span class="action-group-label" data-i18n="displaySettings"></span><div class="action-group-controls"><button id="palette-toggle" class="palette-toggle" type="button" aria-pressed="true" data-i18n-aria-label="paletteToggle"><span class="palette-dot" aria-hidden="true"></span><span id="palette-label" data-i18n="paletteIndependent"></span></button><div class="graph-modes" role="group" data-page-control="architecture" data-i18n-aria-label="graphView" hidden><button id="show-architecture" type="button" aria-pressed="true" data-i18n="architecture"></button><button id="show-workflow" type="button" aria-pressed="false" data-i18n="workflow"></button></div><div class="graph-modes" role="group" data-page-control="architecture" data-i18n-aria-label="trace" hidden><button type="button" data-trace="all" aria-pressed="true" data-i18n="all"></button><button type="button" data-trace="upstream" aria-pressed="false" data-i18n="upstream"></button><button type="button" data-trace="downstream" aria-pressed="false" data-i18n="downstream"></button></div></div></div>
    <div class="action-group" role="group" data-page-control="architecture" data-i18n-aria-label="graphTools" hidden><span class="action-group-label" data-i18n="canvasTools"></span><div class="graph-camera action-group-controls"><button id="graph-out" type="button" data-i18n-aria-label="zoomOut">−</button><output id="graph-scale" data-i18n-aria-label="zoom">100%</output><button id="graph-in" type="button" data-i18n-aria-label="zoomIn">+</button><button id="graph-fit" type="button" data-i18n="fit"></button></div></div>
    <label class="search-field" data-page-control="board-section"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="board-search" type="search" maxlength="200" data-i18n-placeholder="searchItems" data-i18n-aria-label="searchItems" autocomplete="off"><kbd>/</kbd></label>
  </section>

  <section id="architecture" class="panel architecture-panel" aria-labelledby="architecture-title">
    <div class="section-head"><div><h2 id="architecture-title" data-i18n="architecture"></h2><p id="graph-overview" class="muted" data-i18n="waiting"></p></div><span id="graph-count" class="badge">—</span></div>
    <p id="graph-warning" class="graph-warning" role="status" hidden></p>
    <details class="graph-provenance"><summary data-i18n="provenance"></summary><p id="graph-source" class="muted" data-i18n="waiting"></p></details>
    <p id="graph-empty" role="status" data-i18n="graphUnread"></p>
    <div class="architecture-layout">
      <div id="graph-viewport" class="graph-viewport" tabindex="0" role="group" data-i18n-aria-label="canvas" aria-describedby="graph-help">
        <div id="graph-stage" class="graph-stage">
          <svg id="graph-edges" class="graph-edges" viewBox="0 0 940 440" aria-hidden="true"><defs><marker id="edge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs></svg>
        </div>
      </div>
      <aside class="module-detail" aria-live="polite"><span class="nav-label" data-i18n="selected"></span><h3 id="module-title" data-i18n="unselected"></h3><p id="module-description" data-i18n="generated"></p><p id="module-connection" class="muted"></p><div class="relation-heading" data-i18n="direct"></div><ul id="module-relations" class="module-relations"></ul><details class="graph-provenance"><summary data-i18n="sources"></summary><code id="module-path"></code></details><a id="module-jump" href="#task-section" data-i18n="viewTask"></a></aside>
    </div>
    <div class="graph-caption"><span id="graph-summary" role="status" data-i18n="noRelations"></span><span id="graph-help" data-i18n="graphHelp"></span></div>
    <div class="workspace-chip"><span data-i18n="currentWorkspace"></span><code id="workspace" data-i18n="connecting"></code></div>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite">
    <span class="notice-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7.2v.1"/></svg></span>
    <span id="notice-message" data-i18n="reading"></span>
  </div>

  <section id="board-section" class="panel" aria-labelledby="board-title">
    <h2 id="board-title" class="sr-only" data-i18n="navBoard"></h2>
    <p id="board-status" class="board-status" role="status" data-i18n="boardWaiting"></p>
    <div id="board-empty" class="empty-state" hidden><h3 data-i18n="noResults"></h3><button id="search-clear" type="button" data-i18n="clearSearch"></button></div>
    <div id="board-columns" class="board-columns"></div>

  </section>

  <section id="git-section" class="panel git-panel">
    <div class="section-head">
      <div><p class="eyebrow" data-i18n="isolated"></p><h2 data-i18n="git"></h2></div>
      <span class="badge"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 8 4-4 4 4-4 4-4-4ZM8 16l4-4 4 4-4 4-4-4Z"/><path d="M12 8v4"/></svg> <span data-i18n="readonly"></span></span>
    </div>
    <div class="git-summary-row"><p id="git-summary" class="muted" data-i18n="gitLoading"></p><span class="git-legend" data-i18n="manualRefresh"></span></div>
    <div id="git-tasks" class="git-tasks"></div>
  </section>

  <footer><span data-i18n="app"></span><span id="updated"></span></footer>
</main>
<dialog id="launch-dialog" class="action-dialog" aria-labelledby="launch-title"><header class="dialog-header"><h2 id="launch-title" data-i18n="launchSettings"></h2><button id="launch-close" type="button" data-i18n-aria-label="closeDetails">×</button></header><p id="launch-scope"></p><p class="muted" data-i18n="launchHint"></p><form id="launch-form"><label><span data-i18n="modelChoice"></span><select id="launch-model"><option value="" data-i18n="hostDefault"></option></select></label><label><span data-i18n="thinkingChoice"></span><select id="launch-thinking" disabled><option value="" data-i18n="hostDefault"></option></select></label><p id="launch-status" role="status" aria-live="polite"></p><div class="sheet-actions"><button id="launch-start" class="primary" type="submit" data-i18n="reviewAndStart" disabled></button><button id="launch-cancel" type="button" data-i18n="cancel"></button></div></form></dialog>
<dialog id="project-dialog" class="action-dialog" aria-labelledby="project-dialog-title">
  <header class="dialog-header"><h2 id="project-dialog-title" data-i18n="projectControls"></h2><button id="project-close" type="button" data-i18n-aria-label="closeDetails">×</button></header>
  <p class="muted"><span id="status-metric"></span> · <span id="criteria-count"></span> <span data-i18n="acceptance"></span> · <span id="blocked-count"></span> <span data-i18n="blockers"></span></p>
  <section id="task-section" class="dashboard-grid" data-i18n-aria-label="taskActions">
    <article class="task-panel"><div class="section-head"><h2 data-i18n="currentTask"></h2><span id="task-id" class="badge">STATE</span></div><h3 id="goal"></h3><p id="current"></p><h4 data-i18n="acceptance"></h4><span id="criteria-state"></span><ul id="criteria" class="clean-list"></ul><details><summary data-i18n="scopeConstraints"></summary><h4 data-i18n="scope"></h4><ul id="scope" class="clean-list"></ul><h4 data-i18n="constraints"></h4><ul id="constraints" class="clean-list"></ul></details><div id="followup" class="hint" hidden></div></article>
    <article class="action-panel"><h2 id="editor-title" data-i18n="actions"></h2><div id="uninitialized" hidden><p data-i18n="initHint"></p><button id="initialize" class="primary" type="button" data-i18n="initialize"></button></div>
      <form id="start-form" hidden><label><span data-i18n="taskId"></span><input id="new-id" required pattern="[a-z0-9]([a-z0-9]|-){0,63}" maxlength="64"></label><label><span data-i18n="goal"></span><textarea id="new-goal" required maxlength="20000" rows="2"></textarea></label><label><span data-i18n="acceptance"></span><textarea id="new-criteria" required maxlength="20000" rows="3"></textarea></label><label><span data-i18n="scope"></span><textarea id="new-scope" maxlength="20000" rows="2"></textarea></label><label><span data-i18n="constraints"></span><textarea id="new-constraints" maxlength="20000" rows="2"></textarea></label><button class="primary" type="submit" data-i18n="createTask"></button></form>
      <form id="progress-form" hidden><label><span data-i18n="progress"></span><textarea id="edit-current" required maxlength="20000" rows="3"></textarea></label><label><span data-i18n="next"></span><textarea id="edit-next" maxlength="20000" rows="3"></textarea></label><label><span data-i18n="blocked"></span><textarea id="edit-blocked" maxlength="20000" rows="2"></textarea></label><p class="hint" data-i18n="verificationHint"></p><button class="primary" type="submit" data-i18n="saveProgress"></button></form>
    </article>
  </section>
</dialog>
<dialog id="accept-dialog" class="action-dialog" aria-labelledby="accept-title"><header class="dialog-header"><h2 id="accept-title" data-i18n="humanAcceptance"></h2><button id="accept-close" type="button" data-i18n-aria-label="closeDetails">×</button></header><p id="accept-item-title"></p><form id="accept-form"><div id="accept-criteria"></div><label><span data-i18n="reviewer"></span><input id="accept-reviewer" required maxlength="160"></label><label><span data-i18n="conclusion"></span><textarea id="accept-conclusion" required maxlength="2000" rows="2"></textarea></label><label><span data-i18n="reviewEvidence"></span><textarea id="accept-evidence" required maxlength="8000" rows="4"></textarea></label><label><span data-i18n="reviewResult"></span><select id="accept-result"><option value="pass" data-i18n="reviewPass"></option><option value="fail" data-i18n="reviewFail"></option></select></label><button class="primary" type="submit" data-i18n="saveAcceptance"></button></form></dialog>
<dialog id="operations-dialog" class="action-dialog" aria-labelledby="operations-title"><header class="dialog-header"><h2 id="operations-title" data-i18n="analysisProgress"></h2><button id="operations-close" type="button" data-i18n-aria-label="closeDetails">×</button></header><button id="operations-refresh" type="button" data-i18n="refreshProgress"></button><p id="operations-notice" role="status"></p><div id="operation-runs"></div><pre id="operation-result" tabindex="0"></pre></dialog>
<dialog id="item-sheet" class="item-sheet" aria-labelledby="item-sheet-title">
  <div class="sheet-header"><button id="item-back" type="button" data-i18n="backToBoard"></button><div class="sheet-navigation" role="group" data-i18n-aria-label="browseItems"><button id="item-previous" type="button" data-i18n-aria-label="previousItem">‹</button><button id="item-next" type="button" data-i18n-aria-label="nextItem">›</button></div><button id="item-close" class="icon-button" type="button" data-i18n-aria-label="closeDetails">×</button></div>
  <div class="sheet-body"><p id="item-sheet-meta" class="eyebrow"></p><h2 id="item-sheet-title" data-i18n="itemDetails"></h2>
    <div id="item-read"><p id="item-description"></p><p id="item-blocker" class="item-blocker" hidden></p><dl class="item-record"><dt data-i18n="itemId"></dt><dd id="item-record-id"></dd><dt data-i18n="taskId"></dt><dd id="item-record-task"></dd><dt data-i18n="git"></dt><dd id="item-record-git"></dd></dl><div class="sheet-actions"><button id="item-edit" type="button" data-i18n="edit"></button><button id="item-guide" type="button" data-i18n="guideAgent"></button></div></div>
    <section id="item-acceptance"><h3 data-i18n="acceptance"></h3><ul id="item-criteria" class="clean-list"></ul><p id="item-review-record"></p><div class="sheet-actions"><button id="item-human-review" class="primary" type="button" data-i18n="humanAcceptance"></button><button id="item-agent-review" type="button" data-i18n="agentAcceptance"></button></div></section>
    <form id="workitem-form" hidden>
      <input id="workitem-id" type="hidden">
      <label><span data-i18n="title"></span><input id="workitem-title" required maxlength="160" autocomplete="off" data-i18n-placeholder="itemTitlePlaceholder"></label>
      <label><span data-i18n="description"></span><textarea id="workitem-description" maxlength="4000" rows="7" data-i18n-placeholder="itemContentPlaceholder"></textarea></label>
      <label><span data-i18n="acceptance"></span> <small data-i18n="perLine"></small><textarea id="workitem-criteria" maxlength="20000" rows="3"></textarea></label>
      <label id="blocker-field"><span data-i18n="blocked"></span><textarea id="workitem-blocker" maxlength="1000" rows="2" disabled></textarea></label>
      <div class="sheet-actions"><button type="submit" class="primary" id="workitem-save" data-i18n="saveChanges"></button><button type="button" id="workitem-cancel" data-i18n="cancel"></button></div>
    </form>
    <div id="item-guidance" hidden><label><span data-i18n="guidanceTitle"></span><textarea id="agent-brief" readonly rows="9"></textarea></label><button id="brief-copy" type="button" data-i18n="copyGuidance"></button><p id="brief-status" role="status"></p></div>
  </div>
</dialog>
<div id="item-menu" class="context-menu" role="menu" data-i18n-aria-label="itemActions" hidden></div>
<dialog id="confirm-dialog"><form method="dialog"><div class="dialog-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 4.5 7.2v9.6L12 21l7.5-4.2V7.2L12 3Z"/><path d="M12 8v4M12 16v.1"/></svg></div><p class="eyebrow" data-i18n="writeConfirmation"></p><h2 data-i18n="confirmTitle"></h2><p id="confirm-description"></p><p id="confirm-workspace" class="path"></p><div class="actions"><button value="cancel" data-i18n="cancel"></button><button value="confirm" class="primary" data-i18n="confirm"></button></div></form></dialog>
<script src="../runtime/renderer/i18n.js"></script><script src="../runtime/renderer/graph-model.js"></script><script src="../runtime/renderer/graph.js"></script><script src="../runtime/renderer/panel.js"></script>
</body></html>
