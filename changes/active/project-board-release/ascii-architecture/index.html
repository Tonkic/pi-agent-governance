<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同源ASCII与架构画板</title><style>body{max-width:1280px;margin:24px auto;padding:0 20px;font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;background:#fafafa;color:#232329}figure{margin:20px 0;background:white;border:1px solid #ddd;border-radius:10px;padding:14px}img{width:100%;height:auto}figcaption{font-weight:600;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><h1>0.7.5：ASCII正文与可视化画板</h1><p>同一份节点/关系生成ASCII方框、方向箭头和画板。新保存方案正文包含受管ASCII区块，重复保存不重复追加；旧基线只提供对应只读视图，不改文件/指纹。图不会替代源码事实，架构仍然可选，三栏和权限不变。</p><p>实际检查：干净npm ci、类型/构建及125项测试通过；固定隔离浏览器88截图、七行为十场景通过，i18n0失败/2既有提示。方框/箭头、历史切换、中文/特殊文字、超限/损坏、重复保存、跨项目保护已检查。使用真实临时后端，宿主事件/模型与审阅记录为夹具；不代表真实宿主安装或实际模型共创质量。</p><figure><figcaption>保存后的ASCII图与同一份可视化设计（测试夹具）</figcaption><a href="state-ascii-design-draft.png"><img src="state-ascii-design-draft.png"></a></figure><div class="grid"><figure><figcaption>1280浅色 · 同源图</figcaption><a href="state-design-1280-light.png"><img src="state-design-1280-light.png"></a></figure><figure><figcaption>1280深色</figcaption><a href="state-design-1280-dark.png"><img src="state-design-1280-dark.png"></a></figure><figure><figcaption>390浅色 · 图文局部滚动</figcaption><a href="state-design-390-light.png"><img src="state-design-390-light.png"></a></figure><figure><figcaption>390深色</figcaption><a href="state-design-390-dark.png"><img src="state-design-390-dark.png"></a></figure></div></html>
