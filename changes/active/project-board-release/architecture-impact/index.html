<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.7.1 架构影响与工作区切换检查</title><style>body{margin:20px;background:#f4f5f7;color:#20252c;font:15px system-ui}main{max-width:1280px;margin:auto}img{display:block;width:100%;border:1px solid #ccd2db;border-radius:10px}p{line-height:1.6}section{margin:24px 0}button{margin:4px;padding:8px}</style><main><h1>0.7.1 架构影响与工作区切换</h1><p>隔离 Chromium 76图回归。架构影响三态、手动来源核对、旧草稿只读隔离、新项目明确启用。模拟宿主事件/模型，真实临时项目后端，不代表真实宿主或SSH验收。两处竞争回归已先失败后通过：旧新建不得在新项目重开弹窗，旧保存刷新不得覆盖新项目提示/焦点。草稿关闭面板即丢失，不自动分析、初始化、安装或重放。</p><nav id="nav"></nav><h2 id="label"></h2><img id="image" alt="当前代表性检查图"><script>const images={'new-item.png':'工作项架构影响','workspace-drafts.png':'原项目草稿只读隔离','new-workspace.png':'未初始化项目','narrow-dark.png':'英文窄屏暗色标识','architecture.png':'手动核对来源与分析时间'};function show(name){document.getElementById('label').textContent=images[name];document.getElementById('image').src=name;}for(const [name,title] of Object.entries(images)){const b=document.createElement('button');b.textContent=title;b.onclick=()=>show(name);document.getElementById('nav').append(b);}show('new-item.png');</script></main></html>
