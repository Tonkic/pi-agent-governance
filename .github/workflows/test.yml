name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- plugin scripts test
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:behaviors
      - run: npm run test:browser
